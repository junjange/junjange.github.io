name: Feedback Check

on:
  pull_request:
    paths:
      - feedbacks/**
      - .github/ISSUE_TEMPLATE/peer-feedback.yml
      - .github/feedback/**
      - composeApp/src/wasmJsMain/kotlin/junjange/dev/ui/model/Career.kt
      - composeApp/src/wasmJsMain/kotlin/junjange/dev/ui/model/Experience.kt
      - composeApp/src/wasmJsMain/kotlin/junjange/dev/ui/model/Feedback.kt
      - composeApp/src/commonMain/composeResources/values/strings.xml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew :composeApp:checkFeedbackOptions :composeApp:generateFeedbacks --no-configuration-cache
